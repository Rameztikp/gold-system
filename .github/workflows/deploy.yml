name: Deploy
# النشر على Cloudflare بعد نجاح الفحص. يحتاج أسرار GitHub:
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SETUP_TOKEN, BACKUP_TOKEN
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - name: Check secrets
        id: s
        run: echo "ok=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.s.outputs.ok == 'true'
        run: npm run build
      - if: steps.s.outputs.ok == 'true'
        name: Migrate D1
        run: npx wrangler d1 migrations apply gold-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.s.outputs.ok == 'true'
        name: Deploy worker
        run: |
          npx wrangler deploy
          printf '{"SETUP_TOKEN":"%s","BACKUP_TOKEN":"%s"}' "$SETUP_TOKEN" "$BACKUP_TOKEN" | npx wrangler secret bulk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
