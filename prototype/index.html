  pick: el => { U.pick = el.dataset.v; $$('.who button', screen).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === U.pick))); },
  preview: () => {
    U.preview = !U.preview; app.classList.toggle('preview', U.preview); pvBar.hidden = !U.preview;
    try { localStorage.setItem(KEY + '-pv', U.preview ? '1' : '0'); } catch (e) { /* ignore */ }
    screen.scrollTop = 0; window.scrollTo(0, 0);
    requestAnimationFrame(() => drawCharts());
  },
  openday: el => go('entry', { day: el.dataset.id, step: 'sales' }),
  opencheck: el => go('entry', { day: el.dataset.id, step: 'check' }),
  dayto: el => { if (!el.dataset.id) return; U.day = el.dataset.id; if (el.dataset.s) { U.step = el.dataset.s; toTop(); } closeModal(); render(); },
  step: el => { U.step = el.dataset.s; if (el.dataset.top) toTop(); render(); },
  'add-sales': () => openLine('sales'), 'add-purch': () => openLine('purch'), 'add-exp': () => openLine('exp'),
  line: el => openLine(el.dataset.sec, el.dataset.id),
  daydata: () => { openModal(dayDataDialog()); liveUpdate(modalRoot.querySelector('form')); },
  newday: () => openModal(newDayDialog()),
  cmpok: el => saveCompare(el.closest('form'), false),
  cmplerr: el => saveCompare(el.closest('form'), true),
  close: () => closeModal(),
  chip: el => {
    const box = el.closest('[data-chips]'), multi = box.dataset.multi === '1', inp = box.nextElementSibling;
    if (multi) el.setAttribute('aria-pressed', String(el.getAttribute('aria-pressed') !== 'true'));
    else $$('.chip', box).forEach(b => b.setAttribute('aria-pressed', String(b === el)));
    const sel = $$('.chip[aria-pressed="true"]', box).map(b => b.dataset.v);
    inp.value = multi ? KARATS.filter(k => sel.includes(k)).join(' + ') : (sel[0] || '');
    const f = el.closest('form'); if (f && f.nn && box.dataset.chips === 'emp') f.nn.value = '';
    // a type or employee chosen by hand is never changed by the suggestions
    if (f && box.dataset.chips === 'c') { f._cTouched = true; const n = f.querySelector('[data-out="cauto"]'); if (n) n.textContent = ''; }
    if (f && box.dataset.chips === 'emp') f._eTouched = true;
    if (f) hideDup(f);
  },
  xask: el => {
    const z = el.closest('[data-x-zone]');
    z.innerHTML = `<label class="lb" for="x-r" style="width:100%;margin:0">سبب الإلغاء</label><input class="in" id="x-r" name="xr" placeholder="مثل: سطر مكرر" style="flex:1 1 220px;height:44px;font-size:15px"><button type="button" class="btn-danger" data-act="xdo">أكّد الإلغاء</button>`;
    z.querySelector('input').focus();
  },
  xdo: () => {
    const f = modalRoot.querySelector('form'), r = (f.xr.value || '').trim();
    if (!r) { f.xr.setAttribute('aria-invalid', 'true'); f.xr.focus(); return; }
    const sec = f.dataset.sec, day = S.days[U.day], arr = day[sec], l = arr.find(x => x.id === f.dataset.id);
    l.x = { r, at: Date.now(), who: ROLES[U.user].name };
    if (sec !== 'exp') reopen(day);
    logIt(day.id, 'cancel', `إلغاء سطر ${SEC_ONE[sec]} ${arr.indexOf(l) + 1}`, `${describe(sec, l)}. السبب: ${r}`);
    save(); closeModal(); U.hl = l.id; U.flash = sec; render(); toast(`${ico('check', 16)} أُلغي السطر، ويبقى ظاهرًا في القائمة`);
  },
  unx: () => {
    const f = modalRoot.querySelector('form'), sec = f.dataset.sec, day = S.days[U.day], arr = day[sec], l = arr.find(x => x.id === f.dataset.id);
    delete l.x; if (sec !== 'exp') reopen(day);
    logIt(day.id, 'edit', `إرجاع سطر ملغى ${arr.indexOf(l) + 1}`, describe(sec, l));
    save(); closeModal(); U.hl = l.id; render(); toast(`${ico('check', 16)} رجع السطر إلى الحساب`);
  },
  dtab: el => {
    U.dtab = el.dataset.k; render();
    const t = $('#tile-' + U.dtab); if (t) t.focus({ preventScroll: true });
    const pnl = $('#dpanel');
    if (pnl && app.clientWidth <= 820) pnl.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  },
  emp: el => { if (DASH) openModal(empDialog(el.dataset.n, DASH.ids, DASH.R.label)); },
  pkind: el => {
    const key = pkey(el.dataset.p), k = el.dataset.k, P = U[key];
    if (k === 'range') U[key] = { kind: 'range', anchor: P.anchor, from: monthStart(P.anchor), to: P.anchor > lastDay() ? lastDay() : P.anchor };
    else U[key] = { kind: k, anchor: k === 'day' ? (S.days[P.anchor] ? P.anchor : (dayIds().filter(x => x <= P.anchor).slice(-1)[0] || lastDay())) : P.anchor };
    render();
  },
  pmove: el => {
    const P = U[pkey(el.dataset.p)], dir = Number(el.dataset.d), ids = dayIds();
    if (P.kind === 'day') { const n = dir < 0 ? ids.filter(x => x < P.anchor).slice(-1)[0] : ids.find(x => x > P.anchor); if (n) P.anchor = n; }
    else if (P.kind === 'week') P.anchor = add(P.anchor, 7 * dir);
    else if (P.kind === 'month') { const t = D(monthStart(P.anchor)); t.setUTCMonth(t.getUTCMonth() + dir); P.anchor = ID(t); }
    render();
  },
  plast: el => { U[pkey(el.dataset.p)] = { kind: 'month', anchor: lastDay() }; render(); },
  pday: el => { U.period = { kind: 'day', anchor: el.dataset.id }; tip.hidden = true; render(); },
  tview: () => { U.tview = !U.tview; render(); },
  rkind: el => { U.rkind = el.dataset.k; render(); },
  print: () => toast(`${ico('print', 16)} الطباعة والحفظ PDF تشتغل في النظام الحقيقي. هنا تشوف شكل التقرير فقط.`),
  logf: el => { U.logf = el.dataset.k; render(); },
  ws: el => { S.settings.weekStart = Number(el.dataset.v); save(); render(); toast(`${ico('check', 16)} بداية الأسبوع: ${DAYS_AR[S.settings.weekStart]}`); },
  resetask: () => { U.confirmReset = true; render(); },
  resetno: () => { U.confirmReset = false; render(); },
  reset: () => { S = seed(); save(); PHOTO_CACHE.clear(); IDB.clear(); Object.assign(U, { confirmReset: false, period: null, rperiod: null, qperiod: null, q: '', dm: null, pv: null, day: lastDay() }); render(); toast(`${ico('check', 16)} رجعت بيانات الدفتر الأصلية`); },
  usertoggle: el => { const u = S.users.find(x => x.id === el.dataset.id); u.on = !u.on; save(); render(); toast(`${ico('check', 16)} ${u.on ? 'يستطيع' : 'لا يستطيع'} ${esc(u.name)} الدخول الآن`); },
  toast: el => toast(esc(el.dataset.msg)),
  // price fix from the day header
  prices: el => { openModal(pricesDialog(el.dataset.f)); setTimeout(() => { const i = modalRoot.querySelector('[autofocus]'); if (i && i.select) i.select(); }, 60); },
  // البيان suggestions and the duplicate question
  sug: el => sugPick(el.closest('form'), Number(el.dataset.i)),
  dupok: el => { const f = el.closest('form'); f._dupOK = true; saveLine(f); },
  dupno: el => { clearLine(el.closest('form')); toast('لم يُحفظ السطر المكرر.'); },
  // WhatsApp
  wa: el => openModal(waDialog(el.dataset.id || U.day, el.dataset.to === 'owner')),
  // the window stays open: if the browser blocks the new page, the message can still be copied
  waopen: () => toast(`${ico('send', 16)} يُفتح الواتساب في صفحة جديدة والرسالة جاهزة فيه. إذا لم يُفتح، انسخ الرسالة وألصقها.`),
  wacopy: () => { const src = modalRoot.querySelector('.wa-src'); copyText(src ? src.value : ''); },
  repwa: () => toast(`${ico('chat', 16)} في النظام الحقيقي: يجهّز التقرير ملف PDF ويفتح قائمة المشاركة، فتختار الواتساب ثم الشخص.`),
  // search
  qsec: el => { U.qs = el.dataset.k; render(); },
  qpkind: el => {
    if (el.dataset.k === 'all') { U.qperiod = null; render(); return; }
    if (!U.qperiod) U.qperiod = { kind: 'month', anchor: lastDay() };
    ACTS.pkind(el);
  },
  qex: el => { U.q = el.dataset.v; render(); focusSearch(); },
  qall: () => { U.qperiod = null; U.qs = 'all'; render(); focusSearch(); },
  sres: el => go('entry', { day: el.dataset.id, step: el.dataset.sec, hl: el.dataset.l, fromSearch: true }),
  sday: el => go('entry', { day: el.dataset.id, step: 'sales', fromSearch: true }),
  // dashboard: «3 أيام فيها خطأ» opens the list of those days
  alist: el => { if (DASH) openModal(alertDialog(el.dataset.k)); },
  // ledger photos
  pvtoggle: el => { const id = el.dataset.id || U.day; U.pv = U.pv && U.pv.day === id ? null : { day: id }; render(); },
  pvclose: () => { U.pv = null; render(); },
  pvtab: el => { if (U.pv) { U.pv.sel = el.dataset.v; if (U.route === 'days') render(); else syncViewer(); } },
  pvzoom: el => { const z = el.dataset.z; pvZoom(z === 'fit' ? 1 : z === 'in' ? PV.z * 1.5 : PV.z / 1.5); },
  pvshow: el => { U.pv = { day: el.dataset.id, sel: el.dataset.v, step: U.route === 'entry' ? U.step : null }; closeModal(); render(); },
  photos: el => openModal(photosDialog(el.dataset.id || (U.pv && U.pv.day) || U.day)),
  phlabel: el => {
    const p = photosOf(el.dataset.id).find(x => x.id === el.dataset.pid); if (!p) return;
    p.label = el.dataset.v; save(); openModal(photosDialog(el.dataset.id)); syncViewer(true);
  },
  phdelask: el => {
    const z = modalRoot.querySelector(`[data-phx="${el.dataset.pid}"]`);
    z.innerHTML = `<span class="u">متأكد؟</span><button type="button" class="btn-danger" data-act="phdel" data-id="${el.dataset.id}" data-pid="${el.dataset.pid}">نعم، أزلها</button><button type="button" class="btn-ghost btn-sm" data-act="phdelno" data-id="${el.dataset.id}">لا</button>`;
  },
  phdelno: el => openModal(photosDialog(el.dataset.id)),
  phdel: el => {
    const d = S.days[el.dataset.id], p = (d.photos || []).find(x => x.id === el.dataset.pid); if (!p) return;
    const name = photoNames(d.photos)[p.id];
    d.photos = d.photos.filter(x => x !== p);
    if (p.src.startsWith('idb:')) { PHOTO_CACHE.delete(p.id); IDB.del(p.id); }
    logIt(d.id, 'day', 'إزالة صورة من صور الدفتر', name);
    save(); openModal(photosDialog(d.id)); render(); toast(`${ico('check', 16)} أُزيلت الصورة، وسُجّل ذلك في السجل`);
  },
  ndphlabel: el => { const f = el.closest('form'); const p = (f._photos || [])[Number(el.dataset.i)]; if (p) { p.label = el.dataset.v; ndPhotosRender(f); } },
  ndphdel: el => { const f = el.closest('form'); (f._photos || []).splice(Number(el.dataset.i), 1); ndPhotosRender(f); },
  // days page: one month at a time
  dmove: el => { const t = D(U.dm || monthStart(lastDay() || ID(new Date()))); t.setUTCMonth(t.getUTCMonth() + Number(el.dataset.d)); U.dm = ID(t); render(); },
  dlast: () => { U.dm = null; render(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACTS[el.dataset.act]; if (!fn) return;
  fn(el, e);
});
document.addEventListener('submit', e => {
  const f = e.target; if (!f.dataset || !f.dataset.form) return;
  e.preventDefault();
  const k = f.dataset.form;
  if (k === 'login') { U.user = U.pick || 'owner'; U.route = U.user === 'owner' ? 'dash' : 'days'; U.day = lastDay(); U.step = 'sales'; U.period = null; U.rperiod = null; render(); toTop(); return; }
  if (k === 'line') return saveLine(f);
  if (k === 'daydata') return saveDayData(f);
  if (k === 'prices') return savePrices(f);
  if (k === 'newday') return newDay(f);
  if (k === 'wanum') {
    const v = (f.wa.value || '').trim(), n = v ? waNorm(v) : '';
    if (v && (n.length < 9 || n.length > 15)) { f.wa.setAttribute('aria-invalid', 'true'); f.wa.focus(); toast('اكتب رقمًا صحيحًا، مثل 0501234567'); return; }
    S.settings.wa = n; save(); render();
    toast(`${ico('check', 16)} ${n ? `حُفظ رقم صاحب المحل: ${num(waFmt(n))}` : 'مُسح الرقم'}`);
    return;
  }
  if (k === 'addname') { const n = (f.nm.value || '').trim(); if (n && !S.settings.names.includes(n)) { S.settings.names.push(n); save(); render(); toast(`${ico('check', 16)} أُضيف الاسم ${esc(n)}`); } return; }
  if (k === 'addcat') { const n = (f.cat.value || '').trim(); if (n && !S.settings.cats.includes(n)) { S.settings.cats.push(n); save(); render(); toast(`${ico('check', 16)} أُضيف النوع ${esc(n)}`); } }
});
document.addEventListener('input', e => {
  const t = e.target, f = t.form;
  if (t.id === 'q') { U.q = t.value; const sr = $('#sr', screen); if (sr) sr.innerHTML = searchResults(); return; }
  if (f && f.dataset.form === 'line') {
    if (t.name === 'g') splitDot(f);
    if (t.name === 'd') {
      sugShow(f);
      if (f.dataset.sec === 'exp') { const qn = normS(t.value); expAuto(f, qn ? sugIdx(f).find(r => r.k === qn) || null : null); }
    }
    if (t.name === 'nn' && t.value.trim()) f._eTouched = true;
    hideDup(f);
  }
  if (f && f.dataset.form && ['line', 'daydata', 'compare', 'newday'].includes(f.dataset.form)) liveUpdate(f);
  if (f && f.dataset.form === 'line' && e.target.name === 'nn' && e.target.value.trim()) $$('[data-chips="emp"] .chip', f).forEach(b => b.setAttribute('aria-pressed', 'false'));
});
// ledger photos chosen from the device, or dragged onto a «أضف صورًا» area
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset || !t.dataset.photoIn) return;
  addFiles(t.files, t.dataset.photoIn); t.value = '';
});
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) { e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
document.addEventListener('drop', e => {
  const z = e.target.closest && e.target.closest('[data-drop]'); if (!z) return;
  e.preventDefault(); z.classList.remove('over'); addFiles(e.dataTransfer && e.dataTransfer.files, z.dataset.drop);
});
document.addEventListener('change', e => {
  const a = e.target.dataset && e.target.dataset.actChange; if (!a) return;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) return;
  U[pkey(e.target.dataset.p)][a] = e.target.value;
  render();
});
// Enter moves to the next box; in the last box it saves. Esc closes a window.
document.addEventListener('keydown', e => {
  const t = e.target, f = t.form;
  // the البيان suggestions: arrows move through the list, Enter takes the highlighted one, Esc closes the list only
  if (f && f.dataset.form === 'line' && t.name === 'd' && !e.isComposing) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!(f._sug && f._sug.length)) sugShow(f);
      if (f._sug && f._sug.length) { e.preventDefault(); sugMove(f, e.key === 'ArrowDown' ? 1 : -1); }
      return;
    }
    if (f._sug && f._sug.length && e.key === 'Escape') { e.preventDefault(); sugHide(f); return; }
    if (f._sug && f._sug.length && e.key === 'Enter' && f._sugI >= 0) { e.preventDefault(); sugPick(f, f._sugI); return; }
  }
  if (e.key === 'Escape' && modalRoot.innerHTML) { e.preventDefault(); closeModal(); return; }
  // on a phone the photos fill the screen, so Esc closes them
  if (e.key === 'Escape' && U.pv && app.clientWidth <= 820) { e.preventDefault(); U.pv = null; render(); return; }
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  if (!f || !f.dataset.form || t.tagName !== 'INPUT') return;
  if (t.name === 'xr') { e.preventDefault(); ACTS.xdo(); return; }
  if (!['line', 'newday', 'daydata', 'compare', 'prices'].includes(f.dataset.form)) return;
  if (t.dataset.skip) return;
  const fields = navFields(f);
  const i = fields.indexOf(t);
  if (i > -1 && i < fields.length - 1) { e.preventDefault(); fields[i + 1].focus(); if (fields[i + 1].select) fields[i + 1].select(); return; }
  if (f.dataset.form === 'compare') { e.preventDefault(); liveUpdate(f); if (f._filled && !f._bad.length && S.days[U.day].status !== 'ok') saveCompare(f, false); }
});
let rz = null;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawCharts, 150); });

/* ================================================================== boot */
document.documentElement.lang = 'ar';
document.documentElement.dir = 'rtl';
try { const th = localStorage.getItem(KEY + '-theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) { /* ignore */ }
S = load();
U = { user: null, route: 'dash', day: null, step: 'sales', period: null, rperiod: null, pick: 'owner', dtab: 'sales', pv: null };
try { if (localStorage.getItem(KEY + '-pv') === '1' && window.innerWidth > 900) { U.preview = true; app.classList.add('preview'); pvBar.hidden = false; } } catch (e) { /* ignore */ }
render();
// photos added earlier on this device come back from the browser's storage
IDB.all().then(m => { if (!m.size) return; m.forEach((v, k) => PHOTO_CACHE.set(k, v)); if (U.user && U.route === 'days') render(); syncViewer(true); });
})();

</script>

</body></html>
