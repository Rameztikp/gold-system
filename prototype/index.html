<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>نظام محل الذهب</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700&display=swap">
<style>
/* Layout: a quiet menu on the right and one working column beside it. Calm surfaces, one soft gold accent, colour only where it means something. Dark by default (the approved look); a light option for long daytime entry. On a phone: slim header, the page, a tab bar. */
:root {
  --bg: #14130F;
  --panel: #100F0C;
  --card: #1B1915;
  --sunk: #171510;
  --raised: #221F1A;
  --sel: #252016;
  --line: #2A2620;
  --line-2: #3A352C;
  --accent-line: #6B5730;
  --fg: #EDE6D8;
  --fg-2: #DDD5C6;
  --muted: #A39A8A;
  --dim: #8C8373;
  --faint: #6C6458;
  --accent: #D6B25E;
  --accent-text: #E2C47F;
  --btn: #CDAD63;
  --btn-hover: #D8B96F;
  --on-btn: #1A1610;
  --ok: #8FD9B0;
  --ok-bg: rgba(116, 198, 157, 0.12);
  --ok-line: #2C5743;
  --warn: #F0A57E;
  --warn-bg: rgba(240, 150, 98, 0.12);
  --lerr: #E2C47F;
  --lerr-bg: rgba(214, 178, 94, 0.12);
  --lerr-line: #5E4A1F;
  --danger: #E8806E;
  --danger-line: #5A3328;
  --mark: #E0453C;
  --scrim: rgba(8, 7, 6, 0.6);
  --chip: #262320;
  --chip-fg: #CFC4B1;
  --in-bg: #12110E;
  --tip-bg: #2A2620;
  --track: #2A2721;
  --c-sales: #C08A1E;
  --c-purch: #199E70;
  --c-exp: #9085E9;
  --c-tot: #E2C47F;
  --grid: #2A2620;
  --base: #4A4130;
  --f-body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, 'Noto Sans Arabic', sans-serif;
  --f-display: 'Noto Kufi Arabic', 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --f-num: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;
  --r-card: 16px;
  --r-ctl: 12px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F1F0EC;
  --panel: #FFFFFF;
  --card: #FFFFFF;
  --sunk: #F7F6F2;
  --raised: #ECEAE4;
  --sel: #F8F2E3;
  --line: #E3DFD6;
  --line-2: #D3CEC2;
  --accent-line: #CDAE68;
  --fg: #23201A;
  --fg-2: #3A352D;
  --muted: #6A6356;
  --dim: #766E61;
  --faint: #9A9285;
  --accent: #A9822F;
  --accent-text: #86661F;
  --btn: #D4B160;
  --btn-hover: #C9A653;
  --on-btn: #1A1610;
  --ok: #1E7A50;
  --ok-bg: #E6F4EC;
  --ok-line: #B9DCC8;
  --warn: #A8501F;
  --warn-bg: #FBEDE4;
  --lerr: #86651C;
  --lerr-bg: #F8F0DC;
  --lerr-line: #E2CF9C;
  --danger: #B4432F;
  --danger-line: #E8BDB3;
  --mark: #D2352C;
  --scrim: rgba(30, 26, 20, 0.35);
  --chip: #EFECE6;
  --chip-fg: #4A443A;
  --in-bg: #FFFFFF;
  --tip-bg: #FFFFFF;
  --track: #ECE9E2;
  --c-tot: #8C6A1F;
  --grid: #ECE9E2;
  --base: #CFC8B8;
  color-scheme: light;
}
html, body { background: var(--bg); }
[hidden] { display: none !important; }
body { margin: 0; color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
.dec { font-size: 0.62em; opacity: 0.6; }
.kufi { font-family: var(--f-display); line-height: 1.4; }
.dim { color: var(--dim); }
.u { font-size: 12.5px; color: var(--dim); }
.sub { margin: 0; font-size: 13.5px; color: var(--dim); }
.ico { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; vertical-align: middle; }
.ph-only { display: none; }

/* ---------------------------------------------------------------- app frame */
#app {
  container-type: inline-size;
  container-name: app;
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
}
#app.preview {
  width: 404px;
  max-width: calc(100% - 32px);
  height: min(860px, calc(100dvh - 120px));
  margin: 76px auto 24px;
  border: 10px solid #000;
  border-radius: 46px;
  overflow: hidden;
  padding: 0;
  transform: translateZ(0);
  box-shadow: 0 0 0 1px var(--line), 0 30px 90px rgba(0, 0, 0, 0.45);
}
#app.preview #screen { height: 100%; overflow-y: auto; overflow-x: hidden; padding: 0 12px; scrollbar-width: none; }
#app.preview #screen::-webkit-scrollbar { display: none; }
#pv-bar { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 40; display: flex; gap: 10px; align-items: center; padding: 8px 10px 8px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line-2); color: var(--muted); font-size: 13px; }

/* ---------------------------------------------------------------- shell */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 28px; align-items: start; padding-block: 16px 48px; }
.side { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; gap: 4px; padding: 20px 12px 12px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 12px; padding: 2px 10px 22px; }
.brand b { display: block; font-family: var(--f-display); font-size: 16.5px; font-weight: 600; }
.brand small { display: block; font-size: 12px; color: var(--dim); }
.nav { display: flex; flex-direction: column; gap: 3px; }
.nav button { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 14px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font-size: 15px; text-align: start; }
.nav button:hover { background: var(--raised); color: var(--fg-2); }
.nav button[aria-current="page"] { background: var(--sel); color: var(--accent-text); font-weight: 600; }
.nav .grp { margin: 16px 14px 4px; font-size: 12px; color: var(--faint); font-weight: 600; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 20px; }
.me { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; background: var(--sunk); border: 1px solid var(--line); }
.me-t { flex: 1 1 auto; min-width: 0; }
.me b { display: block; font-size: 14px; }
.me small { display: block; font-size: 12px; color: var(--dim); }
.avatar { width: 38px; height: 38px; flex: 0 0 auto; border-radius: 12px; background: var(--btn); color: var(--on-btn); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line-2); background: transparent; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; padding: 0; flex: 0 0 auto; }
.icon-btn:hover { color: var(--fg); border-color: var(--accent-line); }
.foot-row { display: flex; gap: 8px; }
.foot-row .pv-btn { flex: 1 1 auto; }
.pv-btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 38px; border-radius: 12px; border: 1px dashed var(--line-2); background: transparent; color: var(--muted); font-size: 13px; }
.pv-btn:hover { color: var(--accent-text); border-color: var(--accent-line); }
.shell > .main { min-width: 0; }
.mhead { display: none; }
.tabbar { display: none; }
.page { max-width: 1180px; margin: 0 auto; }

/* ---------------------------------------------------------------- common */
.h1 { margin: 0; font-size: 26px; font-weight: 700; color: var(--fg); text-wrap: balance; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; margin-top: 8px; }
.page-head .sub { margin-top: 4px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); min-width: 0; }
.btn-gold { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 48px; padding: 0 20px; border: 0; border-radius: 13px; background: var(--btn); color: var(--on-btn); font-size: 15.5px; font-weight: 700; white-space: nowrap; }
.btn-gold:hover { background: var(--btn-hover); }
.btn-gold i, .btn-ghost i { font-style: normal; width: 24px; height: 24px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 17px; }
.btn-gold i { background: rgba(26, 22, 16, 0.14); }
.btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 48px; padding: 0 18px; border: 1px solid var(--line-2); border-radius: 13px; background: var(--card); color: var(--fg); font-size: 15px; font-weight: 600; white-space: nowrap; }
.btn-ghost:hover { border-color: var(--accent-line); }
.btn-ghost i { background: var(--sel); color: var(--accent-text); }
.btn-sm { height: 38px; padding: 0 14px; border-radius: 10px; font-size: 13.5px; }
.btn-wide { width: 100%; height: 54px; font-size: 16.5px; }
.btn-text { border: 0; background: none; color: var(--accent-text); padding: 4px 2px; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn-text:hover { text-decoration: underline; text-underline-offset: 4px; }
.btn-danger { border: 1px solid var(--danger-line); background: transparent; color: var(--danger); border-radius: 10px; height: 38px; padding: 0 14px; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
.kbd { display: inline-block; font-family: var(--f-num); font-size: 11px; line-height: 17px; padding: 0 6px; border-radius: 5px; border: 1px solid currentColor; opacity: 0.7; direction: ltr; unicode-bidi: isolate; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; line-height: 1.4; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.lerr { background: var(--lerr-bg); color: var(--lerr); }
.pill.wait { background: var(--chip); color: var(--chip-fg); }
.qm { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; margin-inline-start: 5px; border-radius: 50%; background: var(--sel); color: var(--accent-text); font-size: 11px; font-weight: 700; vertical-align: middle; }
.seg { display: inline-flex; padding: 4px; border-radius: 12px; background: var(--sunk); border: 1px solid var(--line); gap: 2px; }
.seg button { height: 36px; padding: 0 16px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-size: 14px; white-space: nowrap; }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); font-weight: 600; box-shadow: 0 0 0 1px var(--line-2); }
.arw { width: 36px; height: 36px; flex: 0 0 auto; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card); color: var(--fg-2); font-size: 16px; line-height: 1; padding: 0; }
.arw:hover:not(:disabled) { border-color: var(--accent-line); }
.arw:disabled { opacity: 0.3; }
.empty { padding: 30px 20px; text-align: center; color: var(--dim); font-size: 14px; }
.empty-big { margin-top: 18px; padding: 48px 20px; text-align: center; color: var(--dim); display: flex; flex-direction: column; align-items: center; gap: 14px; }
.empty-big p { margin: 0; }
.note { display: flex; align-items: flex-start; gap: 10px; margin-top: 10px; padding: 11px 14px; border-radius: 12px; background: var(--sunk); border: 1px solid var(--line); font-size: 13.5px; color: var(--fg-2); line-height: 1.7; }
.redmark { flex: 0 0 auto; width: 18px; height: 18px; margin-top: 3px; border-radius: 50%; border: 2.5px solid var(--mark); }

/* ---------------------------------------------------------------- line lists (a table on a computer, two-line rows on a phone) */
.lines { display: flex; flex-direction: column; }
.lh, .ln, .lf { display: grid; align-items: center; gap: 0 14px; padding: 0 20px; }
.lh { font-size: 12px; color: var(--dim); padding-block: 11px; border-bottom: 1px solid var(--line); }
.ln { width: 100%; min-height: 52px; padding-block: 10px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--fg-2); text-align: start; font-size: 15px; }
button.ln:hover { background: var(--sunk); }
.ln.is-new { animation: rowin 1.8s ease-out 1; }
@keyframes rowin { 0% { background: var(--sel); } 100% { background: transparent; } }
.ln.is-x { opacity: 0.5; }
.ln.is-x .c-d { text-decoration: line-through; }
.ln .xr { display: block; font-size: 12px; color: var(--danger); text-decoration: none; }
.lf { padding-block: 14px; background: var(--sunk); color: var(--fg); font-weight: 600; border-radius: 0 0 var(--r-card) var(--r-card); }
.c-n { color: var(--faint); font-size: 13px; }
/* Amounts line up on their last digit, right under their heading: 1,400.00 and 14,600.00 share the same right edge, so the decimals sit in one column. */
.c-r { text-align: start; }
/* the day tables follow the ledger, read from the right: the price first. Each column has a smallest and a largest width, so a table still fits beside the photo panel. */
.l-sales .lh, .l-sales .ln, .l-sales .lf { grid-template-columns: 34px minmax(92px, 120px) minmax(84px, 110px) minmax(140px, 1fr) minmax(72px, 96px) minmax(64px, 82px); }
.l-purch .lh, .l-purch .ln, .l-purch .lf { grid-template-columns: 34px minmax(92px, 150px) minmax(84px, 150px) minmax(140px, 1fr); }
.l-purch .lf .c-d .u { display: block; font-weight: 400; margin-top: 2px; }
.l-exp .lh, .l-exp .ln, .l-exp .lf { grid-template-columns: 34px minmax(90px, 120px) minmax(140px, 1fr) minmax(120px, 160px) minmax(72px, 110px); }
.l-days .lh, .l-days .ln, .l-days .lf { grid-template-columns: minmax(118px, 1.3fr) minmax(90px, 140px) minmax(90px, 140px) minmax(80px, 120px) minmax(118px, 1.2fr) 128px; gap: 0 12px; }
.l-days .c-d b { display: block; font-weight: 600; color: var(--fg); }
.l-days .c-d .u { display: block; }
/* the ledger-error note keeps to two lines here; the whole note is on the day itself */
.l-days .nt { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; margin-top: 5px; line-height: 1.55; }
/* a days row: the date is the button that opens the day, stretched over the whole row; the ledger photos sit above it */
.l-days .ln { position: relative; }
.l-days .ln:hover { background: var(--sunk); }
.l-days .ln.is-pv { background: var(--sel); }
.dl-go { padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: start; cursor: pointer; }
.dl-go::after { content: ""; position: absolute; inset: 0; }
.dl-go:focus-visible { outline: none; }
.dl-go:focus-visible::after { box-shadow: inset 0 0 0 2px var(--accent); }
.l-days .c-ph { position: relative; z-index: 1; display: flex; }
/* in a table every cell shows; the two-line rows (a phone, or a narrow page) swap a few cells */
.lines .only-rows { display: none; }
.chipk { display: inline-block; padding: 2px 8px; border-radius: 8px; background: var(--chip); color: var(--chip-fg); font-size: 12.5px; font-weight: 500; }
.chipk.new { background: var(--ok-bg); color: var(--ok); }

/* ---------------------------------------------------------------- a day: header and steps */
.dayhead { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 30px; padding: 14px 18px; border-radius: var(--r-card); background: var(--card); border: 1px solid var(--line); margin-top: 8px; }
.dh-date { display: flex; align-items: center; gap: 12px; }
.dh-date h1 { margin: 0; font-size: 20px; font-weight: 700; white-space: nowrap; }
.dh-facts { display: flex; flex-wrap: wrap; gap: 6px 26px; margin: 0; }
.dh-facts div { display: flex; flex-direction: column; }
.dh-facts dt { font-size: 12px; color: var(--dim); }
.dh-facts dd { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
.dh-end { margin-inline-start: auto; display: flex; align-items: center; gap: 14px; }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.steps button { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); text-align: start; color: var(--muted); min-width: 0; }
.steps button:hover { border-color: var(--line-2); }
.steps .sn { width: 32px; height: 32px; flex: 0 0 auto; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--chip); color: var(--fg-2); font-family: var(--f-num); font-weight: 700; font-size: 14px; }
.steps .sn.ok { background: var(--ok-bg); color: var(--ok); }
.steps .sn.lerr { background: var(--lerr-bg); color: var(--lerr); }
.steps .st-t { min-width: 0; }
/* a long step name breaks onto a second line on a narrow page, never «المقارنة بالـ…» */
.steps .st-t b { display: block; font-size: 14.5px; font-weight: 600; color: var(--fg); line-height: 1.35; text-wrap: balance; }
.steps .st-t span { display: block; font-size: 13px; color: var(--dim); white-space: nowrap; }
.steps button[aria-current="step"] { border-color: var(--accent-line); background: var(--sel); }
.steps button[aria-current="step"] .sn:not(.ok):not(.lerr) { background: var(--btn); color: var(--on-btn); }
.steps button.flash .st-t span { animation: flash 1.2s ease-out 1; }
@keyframes flash { 0% { color: var(--dim); } 30% { color: var(--accent-text); } 100% { color: var(--dim); } }
.step-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 16px; margin: 26px 0 12px; }
.step-head h2 { margin: 0; font-size: 20px; font-weight: 700; }
.step-head .sub { margin-top: 3px; }
.step-head .acts { display: flex; flex-wrap: wrap; gap: 10px; }
.sumbox { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; margin-top: 12px; padding: 13px 18px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 14px; color: var(--fg-2); }
.sumbox .sb-f { flex: 1 1 260px; }
.sumbox .sb-f small { display: block; font-size: 12.5px; color: var(--dim); }
.sumbox .sb-v { font-weight: 600; }
/* a number reads left to right, so its «start» is its left: the gap after the label is set on the right */
.sumbox .sb-v b { font-size: 19px; margin-right: 6px; color: var(--accent-text); }
.step-next { display: flex; justify-content: flex-end; margin-top: 18px; }
.done-box { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 18px; margin-bottom: 14px; border-radius: 14px; background: var(--ok-bg); border: 1px solid var(--ok-line); }
.done-box .done-ic { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--card); color: var(--ok); flex: 0 0 auto; }
.done-box b { color: var(--ok); }
.done-box > div { flex: 1 1 220px; }
.done-box.lerr { background: var(--lerr-bg); border-color: var(--lerr-line); }
.done-box.lerr .done-ic { color: var(--lerr); font-weight: 800; font-size: 18px; }
.done-box.lerr b { color: var(--lerr); }
.cmp-card { overflow: hidden; }
.tscroll { overflow-x: auto; }
.cmp { width: 100%; border-collapse: collapse; }
.cmp th { font-size: 12px; font-weight: 500; color: var(--dim); text-align: start; padding: 11px 16px; border-bottom: 1px solid var(--line); }
.cmp td { padding: 9px 16px; border-bottom: 1px solid var(--line); font-size: 14.5px; vertical-align: middle; }
.cmp td b { display: block; font-weight: 600; }
.cmp td .u { display: block; }
.cmp .in { height: 44px; font-size: 16px; width: 170px; }
.cmp tr.bad { background: var(--warn-bg); }
.cmp-out { padding: 4px 18px 18px; }
.cmp-out .verdict { margin-top: 12px; }

/* ---------------------------------------------------------------- dashboard */
.dash-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 20px; margin-top: 8px; }
.dash-head .sub { margin-top: 4px; }
.period { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.pnav { display: flex; align-items: center; gap: 8px; }
.pnav b { min-width: 150px; text-align: center; font-weight: 600; font-size: 15px; }
.range { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.range input { height: 40px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--in-bg); color: var(--fg); padding: 0 10px; }
/* what needs the owner's attention: one card, one row per problem; a row that can be fixed says where it leads */
.attn { margin-top: 16px; overflow: hidden; }
.attn-h { margin: 0; padding: 13px 18px 9px; font-size: 13px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); }
.attn-i { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 9px 18px; border: 0; background: transparent; color: var(--fg-2); text-align: start; font-size: 14px; }
.attn-i + .attn-i { border-top: 1px solid var(--line); }
button.attn-i:hover { background: var(--sunk); }
button.attn-i:hover .attn-go { text-decoration: underline; text-underline-offset: 4px; }
.attn-m { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--chip); color: var(--chip-fg); font-size: 14px; font-weight: 800; }
.attn-m.warn { background: var(--lerr-bg); color: var(--lerr); }
.attn-t { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; line-height: 1.6; }
.attn-t b { font-weight: 600; color: var(--fg); }
.attn-go { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 2px; font-size: 13px; color: var(--accent-text); white-space: nowrap; }
.attn-ok { margin-top: 16px; display: flex; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 14px; border: 1px solid var(--ok-line); background: var(--ok-bg); color: var(--ok); font-size: 14px; font-weight: 500; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
.tile { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 16px 18px; border-radius: var(--r-card); border: 1px solid var(--line); background: var(--card); text-align: start; color: var(--fg); min-width: 0; }
.tile:hover { border-color: var(--line-2); }
.tile .tl { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); }
.tile .tl i { width: 9px; height: 9px; border-radius: 3px; flex: 0 0 auto; }
.tile .tv { font-size: 26px; font-weight: 600; line-height: 1.3; }
.tile .ts { font-size: 12.5px; color: var(--dim); }
.tile .delta { margin-top: 6px; }
.tile .tgo { margin-top: 8px; display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 500; color: var(--accent-text); }
.tile:hover .tgo { text-decoration: underline; text-underline-offset: 4px; }
.tile[aria-selected="true"] .tgo { font-weight: 600; text-decoration: none; }
.tile[aria-selected="true"] { border-color: var(--accent-line); background: var(--sel); box-shadow: inset 0 0 0 1px var(--accent-line); }
.tile[aria-selected="true"] .tl { color: var(--accent-text); }
.tile[aria-selected="true"]::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 14px; height: 14px; background: var(--sel); border-right: 2px solid var(--accent-line); border-bottom: 2px solid var(--accent-line); transform: translateX(-50%) rotate(45deg); }
.delta { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--chip); color: var(--muted); }
.delta.good { color: var(--ok); background: var(--ok-bg); }
.delta.bad { color: var(--warn); background: var(--warn-bg); }
.delta .cmpw { font-weight: 400; }
.panel { margin-top: 18px; overflow: hidden; }
.ph { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 14px; padding: 18px 22px 4px; }
.ph h2 { margin: 0; font-size: 16px; font-weight: 600; }
.ph-r { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.chart { min-height: 60px; padding: 6px 12px 4px; }
.chart text { font-family: var(--f-num); }
.chart .ax { fill: var(--dim); font-size: 11px; }
.chart .ax-d { fill: var(--muted); font-size: 11.5px; font-weight: 600; }
.chart .ax-w { fill: var(--dim); font-size: 11px; font-family: var(--f-body); direction: rtl; }
.chart .lbl { fill: var(--fg); font-size: 12px; font-weight: 600; }
.chart .gl { stroke: var(--grid); }
.chart .bl { stroke: var(--base); }
.chart .hit { fill: transparent; }
.chart .hit:hover { fill: var(--sel); fill-opacity: 0.5; }
.chart-hint { margin: 0; padding: 0 22px 14px; font-size: 12.5px; color: var(--dim); }
#dpanel { scroll-margin-top: 12px; }
.dbar { margin-top: 16px; }
.dtop { display: flex; flex-direction: column; }
.ds-st { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.dstrip { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 16px 22px; font-size: 14px; color: var(--muted); }
.dstrip b { color: var(--fg); font-size: 16px; margin-right: 7px; }
.dstrip .btn-sm { margin-inline-start: auto; }
.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.pgrid.first { border-top: 0; }
.pgrid.one { grid-template-columns: minmax(0, 1fr); }
.blk { padding: 18px 22px 22px; min-width: 0; }
.blk + .blk { border-inline-start: 1px solid var(--line); }
.bh { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 14px; }
.bh h3 { margin: 0; font-size: 15px; font-weight: 600; }
.verdict { padding: 12px 14px; border-radius: 12px; background: var(--sunk); border: 1px solid var(--line); font-size: 13.5px; line-height: 1.7; color: var(--fg-2); }
.pstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
.pstats div { background: var(--card); padding: 16px 22px; }
.pstats small { display: block; font-size: 12.5px; color: var(--dim); }
.pstats b { display: block; margin-top: 3px; font-size: 20px; font-weight: 600; }
.pnote { padding: 0 22px 20px; background: var(--card); }
.pstats + .pnote { padding-top: 16px; border-top: 1px solid var(--line); }
.xt { width: 100%; border-collapse: collapse; font-size: 14px; }
.xt th { text-align: start; font-weight: 500; color: var(--dim); font-size: 12px; padding: 0 10px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.xt td { padding: 10px; border-bottom: 1px solid var(--line); color: var(--fg-2); }
.xt th:first-child, .xt td:first-child { padding-inline-start: 0; }
.xt th:last-child, .xt td:last-child { padding-inline-end: 0; }
.xt .n { text-align: center; width: 92px; color: var(--muted); }
.xt .r { text-align: start; width: 120px; font-family: var(--f-num); color: var(--fg); }
.xt tfoot td { border-bottom: 0; padding-top: 12px; font-weight: 700; color: var(--fg); }
.xt tbody tr:last-child td { border-bottom: 1px solid var(--line-2); }
.xt tr.go { cursor: pointer; }
.xt tr.go:hover td { background: var(--sunk); }
.xt .lnk { border: 0; background: none; padding: 0; font: inherit; font-weight: 600; color: var(--accent-text); text-decoration: underline; text-decoration-color: var(--accent-line); text-underline-offset: 4px; cursor: pointer; }
.tview { overflow-x: auto; padding: 0 22px 16px; }
.tview table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tview th { text-align: start; font-weight: 500; color: var(--dim); padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 12px; }
.tview td { padding: 8px 10px; border-bottom: 1px solid var(--line); }

/* ---------------------------------------------------------------- report (a printable sheet) */
.rep-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
.rk { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.rk .lb { margin: 0; }
.rep-note { margin: 10px 0 0; }
.paper { margin-top: 16px; padding: 30px 34px 26px; border-radius: 6px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 1px 0 var(--line); }
.paper-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 14px; padding-bottom: 18px; border-bottom: 2px solid var(--fg); }
.paper-head .pbrand { display: flex; align-items: center; gap: 12px; }
.paper-head .pbrand b { display: block; font-family: var(--f-display); font-size: 16px; }
.paper-head .pbrand small { display: block; font-size: 12px; color: var(--dim); }
.paper-head h1 { margin: 0; font-size: 22px; font-weight: 700; text-align: left; }
.paper-head .per { font-size: 14px; color: var(--muted); text-align: left; }
.paper h2 { margin: 26px 0 10px; font-size: 15px; font-weight: 700; }
.rt { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.rt th { text-align: start; font-weight: 600; color: var(--dim); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.rt td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
.rt .r { text-align: start; white-space: nowrap; }
/* a label beside its value: the values keep to a narrow column at the far edge, lined up on their last digit */
.rt.kv td.r { width: 1%; padding-inline-start: 28px; }
.rt tfoot td { font-weight: 700; border-top: 1.5px solid var(--fg); border-bottom: 0; }
.rt tr.lead td { font-weight: 700; }
.rt.det { min-width: 560px; }
.rt .c-n { width: 34px; color: var(--faint); font-size: 12.5px; }
.rt tr.grp td { padding-top: 18px; font-weight: 700; color: var(--fg); border-bottom: 1px solid var(--line-2); }
.rt tbody:first-of-type tr.grp td { padding-top: 10px; }
.rt tr.sub td { font-weight: 600; color: var(--fg-2); background: var(--sunk); border-bottom: 0; }
.rt tfoot tr.part td { font-weight: 500; color: var(--muted); border-top: 0; padding-top: 4px; }
.rgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
.paper-notes { margin: 0; padding-inline-start: 18px; font-size: 13.5px; line-height: 1.9; color: var(--fg-2); }
.paper-foot { margin-top: 26px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; }

/* ---------------------------------------------------------------- forms & dialogs */
#modal-root:empty { display: none; }
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); }
.dialog { position: fixed; z-index: 51; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(580px, calc(100% - 28px)); max-height: calc(100% - 28px); overflow-y: auto; background: var(--card); border: 1px solid var(--line-2); border-radius: 20px; padding: 22px 24px 20px; box-shadow: 0 30px 90px rgba(0, 0, 0, 0.35); }
.dialog.wide { width: min(720px, calc(100% - 28px)); }
.dlg-h { display: flex; align-items: center; gap: 10px; }
.dlg-h h2 { margin: 0; font-size: 20px; font-weight: 700; flex: 1 1 auto; }
.dlg-note { margin-top: 6px; font-size: 13px; color: var(--dim); }
.fgrid { display: grid; gap: 15px; margin-top: 16px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.lb { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.lb .opt { color: var(--faint); font-weight: 400; }
.in { width: 100%; height: 50px; border: 1px solid var(--line-2); border-radius: var(--r-ctl); padding: 0 14px; font-size: 17px; background: var(--in-bg); color: var(--fg); }
.in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--sel); }
.in.num { text-align: left; }
.in[aria-invalid="true"] { border-color: var(--danger); }
.wt { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
.wt .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.wt .cell span { font-size: 11.5px; color: var(--dim); }
.wt .in { width: 84px; text-align: center; }
.wt .bar { color: var(--faint); font-size: 24px; padding-bottom: 8px; }
.wv { margin-bottom: 6px; padding: 8px 13px; border-radius: 10px; background: var(--sel); color: var(--accent-text); font-size: 15px; font-weight: 600; white-space: nowrap; }
.live { font-size: 13px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: 40px; padding: 0 15px; border-radius: 10px; border: 0; font-size: 14.5px; background: var(--in-bg); color: var(--chip-fg); box-shadow: inset 0 0 0 1px var(--line-2); }
.chip[aria-pressed="true"] { background: var(--sel); color: var(--accent-text); box-shadow: inset 0 0 0 1.5px var(--accent-line); font-weight: 600; }
.err { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 13.5px; }
.dlg-f { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }
.dlg-f .btn-gold { flex: 1 1 auto; }
.dlg-hint { margin-top: 10px; font-size: 12px; color: var(--faint); }
.xzone { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line-2); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--dim); }
.sheet-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.sheet-grid .btn-ghost { flex-direction: column; height: auto; padding: 14px 8px; gap: 8px; font-size: 13.5px; white-space: normal; }
.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 14px; background: var(--tip-bg); border: 1px solid var(--line-2); color: var(--fg); font-size: 14px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3); animation: toastin 0.25s ease-out; max-width: calc(100% - 32px); }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
#tip { position: fixed; z-index: 70; pointer-events: none; padding: 8px 11px; border-radius: 10px; background: var(--tip-bg); border: 1px solid var(--line-2); color: var(--fg); font-size: 12.5px; line-height: 1.6; white-space: pre-line; box-shadow: 0 10px 26px rgba(0, 0, 0, 0.3); direction: rtl; font-family: var(--f-body); }

/* ---------------------------------------------------------------- login */
.login { min-height: calc(100dvh - 40px); display: flex; align-items: center; justify-content: center; padding-block: 24px; }
.login-card { width: min(460px, 100%); padding: 32px 28px 24px; border-radius: 22px; border: 1px solid var(--line); background: var(--card); display: flex; flex-direction: column; }
.login-top { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; margin-bottom: 22px; }
.login-top h1 { margin: 0; font-size: 24px; }
.who { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.who button { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--in-bg); text-align: start; }
.who button b { font-size: 15px; }
.who button small { font-size: 12.5px; color: var(--dim); line-height: 1.55; }
.who button[aria-pressed="true"] { border-color: var(--accent-line); background: var(--sel); box-shadow: inset 0 0 0 1px var(--accent-line); }
.login-card .btn-wide { margin-top: 18px; }
.demo-note { margin: 16px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--sunk); border: 1px dashed var(--line-2); font-size: 12.5px; color: var(--dim); line-height: 1.7; }

/* ---------------------------------------------------------------- admin */
.agrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 18px; }
.agrid .wide { grid-column: span 2; }
.ucard { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.ucard .top-row { display: flex; align-items: center; gap: 12px; }
.ucard h2, .scard h2 { margin: 0; font-size: 16px; font-weight: 600; }
.scard { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.loglist { display: flex; flex-direction: column; }
.log-day { padding: 10px 20px; font-size: 13px; font-weight: 600; color: var(--accent-text); background: var(--sunk); border-block: 1px solid var(--line); }
.log-day:first-child { border-top: 0; }
.log-e { display: flex; gap: 12px; padding: 13px 20px; border-bottom: 1px solid var(--line); }
.log-e .li { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
.log-e .lt { font-size: 14.5px; font-weight: 600; }
.log-e .ld { font-size: 13px; margin-top: 3px; color: var(--fg-2); line-height: 1.7; }
.log-e .lm { font-size: 12px; margin-top: 3px; color: var(--dim); }

/* ---------------------------------------------------------------- search, البيان suggestions, the duplicate question, WhatsApp, price fix, month bar */
a.btn-gold, a.btn-ghost { text-decoration: none; }
/* no padding on the mark: Arabic letters stay joined across the marked part */
mark { background: var(--sel); color: var(--accent-text); border-radius: 3px; padding: 0; box-shadow: inset 0 -2px 0 var(--accent-line); }
.sfake { display: flex; align-items: center; gap: 10px; height: 44px; margin: 0 2px 14px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--in-bg); color: var(--faint); font-size: 14px; text-align: start; }
.sfake:hover { border-color: var(--accent-line); color: var(--muted); }
.sfake[aria-current="page"] { border-color: var(--accent-line); background: var(--sel); color: var(--accent-text); }
.mh-end { display: flex; align-items: center; gap: 12px; }
.pen { width: 26px; height: 26px; margin-inline-start: 7px; padding: 0; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; }
.pen:hover { color: var(--accent-text); border-color: var(--accent-line); }
.dh-facts dd { display: flex; align-items: center; white-space: nowrap; }
.back-s { margin: 4px 0 2px; }
.done-box > .done-acts { flex: 0 1 auto; display: flex; flex-wrap: wrap; gap: 10px; }
.days-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-top: 18px; }
.ds-acts { margin-inline-start: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.dstrip .ds-acts .btn-sm { margin-inline-start: 0; }
.rep-acts { display: flex; flex-wrap: wrap; gap: 10px; }
.sugw { position: relative; }
.sug { position: absolute; z-index: 5; inset-inline: 0; top: calc(100% + 6px); display: flex; flex-direction: column; gap: 2px; padding: 6px; border-radius: 14px; background: var(--card); border: 1px solid var(--line-2); box-shadow: 0 18px 44px rgba(0, 0, 0, 0.3); }
.sug-i { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 42px; padding: 6px 12px; border: 0; border-radius: 10px; background: transparent; color: var(--fg); font-size: 15px; text-align: start; }
.sug-i:hover, .sug-i[aria-selected="true"] { background: var(--sel); }
.sug-i small { color: var(--dim); font-size: 12px; white-space: nowrap; }
.opt.auto { color: var(--accent-text); }
.dup { display: flex; flex-direction: column; gap: 3px; margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--lerr-bg); border: 1px solid var(--lerr-line); color: var(--fg-2); font-size: 13.5px; line-height: 1.7; }
.dup b { color: var(--lerr); }
.dup-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.wa-msg { margin-top: 14px; padding: 14px 16px; border-radius: 16px 16px 4px 16px; background: var(--sunk); border: 1px solid var(--line-2); font-size: 14.5px; line-height: 1.85; color: var(--fg); }
.wa-msg span { display: block; }
.wa-msg .sp { height: 8px; }
.wa-msg .ft { color: var(--dim); font-size: 12.5px; }
.wa-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.wa-form .in { width: 230px; height: 44px; font-size: 16px; }
.sbox { margin-top: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.sfield { position: relative; display: block; }
.sfield .ico { position: absolute; inset-inline-start: 15px; top: 50%; transform: translateY(-50%); color: var(--dim); pointer-events: none; }
.sfield .in { height: 54px; padding-inline-start: 46px; -webkit-appearance: none; appearance: none; }
.sfilters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.shint { margin-top: 14px; padding: 18px 20px; }
.shint .chips { margin-top: 12px; }
.sres-h { margin: 16px 2px 10px; font-size: 13.5px; color: var(--muted); }
.sstats { display: inline-grid; grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(210px, 280px); max-width: 100%; overflow: hidden; }
.srlist { margin-top: 12px; overflow: hidden; }
.sr-day { display: flex; justify-content: space-between; gap: 10px; }
.sr-st { font-weight: 400; color: var(--dim); font-size: 12px; }
.sr { display: grid; grid-template-columns: 76px minmax(0, 1fr) minmax(104px, auto); align-items: center; gap: 4px 14px; width: 100%; min-height: 56px; padding: 10px 20px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--fg-2); text-align: start; font-size: 15px; }
.sr:last-child { border-bottom: 0; }
.sr:hover { background: var(--sunk); }

}
function focusSearch() {
  const q = $('#q', screen); if (!q) return;
  q.focus(); const n = q.value.length; try { q.setSelectionRange(n, n); } catch (e) { /* ignore */ }
}
function page() {

  switch (U.route) {
    case 'dash': return viewDash();

const curTheme = () => document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';

/* ================================================================== days */
function statusPill(day, short) {
  if (day.status === 'ok') return `<span class="pill ok">${ico('check', 13)} مطابق للدفتر</span>`;
  if (day.status === 'lerr') return `<span class="pill lerr">! خطأ في جمع الدفتر</span>`;
  return `<span class="pill wait">${short ? 'لم يُقارن' : 'لم يُقارن بالدفتر'}</span>`;
}
const statusText = d => d.status === 'ok' ? 'مطابق' : d.status === 'lerr' ? 'خطأ في جمع الدفتر' : 'لم يُقارن';
const pricesLine = d => `البيع ${num(pr(d.sell))}، الشراء ${num(pr(d.buy))}`;
function viewDays() {
  // one month at a time, so the list stays short as the year fills up
  const M = U.dm || (dayIds().length ? monthStart(lastDay()) : monthStart(ID(new Date())));
  const ids = dayIds().filter(id => monthStart(id) === M).reverse(), A = agg(ids);
  const head = `<section class="page-head">
      <div><h1 class="kufi h1">الأيام</h1><p class="sub">كل يوم مُدخل من الدفتر. اضغط على يوم لفتحه.</p></div>
      <button type="button" class="btn-gold" data-act="newday"><i aria-hidden="true">+</i>افتح يومًا جديدًا</button>
    </section>
    <div class="days-bar"><div class="pnav"><button type="button" class="arw" data-act="dmove" data-d="-1" aria-label="الشهر السابق">›</button><b>${monthLabel(M)}</b><button type="button" class="arw" data-act="dmove" data-d="1" aria-label="الشهر التالي">‹</button></div>${ids.length ? `<span class="u">${daysW(ids.length)} مُدخلة في هذا الشهر</span>` : ''}</div>`;
  if (!ids.length) return head + `<section class="card empty-big" style="margin-top:12px"><p>لا أيام مُدخلة في ${monthLabel(M)}.</p>${dayIds().length ? '<button type="button" class="btn-ghost btn-sm" data-act="dlast">اذهب إلى آخر شهر فيه أيام</button>' : ''}</section>`;
  // the whole row opens the day (the date is the real button, stretched over the row); the photos sit above it and open the viewer
  const rows = ids.map(id => {
    const d = S.days[id], t = T(d), note = d.status === 'lerr' && d.note ? esc(d.note) : '';
    return `<div class="ln${U.pv && U.pv.day === id ? ' is-pv' : ''}" data-id="${id}">
      <span class="c-d"><button type="button" class="dl-go" data-act="openday" data-id="${id}"><b>${DAYS_AR[dow(id)]} ${num(`${dnum(id)}/${D(id).getUTCMonth() + 1}`)}</b></button><span class="u">${pricesLine(d)}</span></span>
      <span class="c-s c-r"><span class="only-rows u">المبيعات </span>${num(money(t.sales))}</span>
      <span class="c-r only-table">${num(money(t.purch))}</span>
      <span class="c-r only-table">${num(money(t.exp))}</span>

      <span class="c-st">${statusPill(d, true)}${note ? `<span class="u nt" title="${note}">${note}</span>` : ''}</span>
      <span class="c-ph">${photosBtn(d, 'btn-text', true)}</span>

  return head + `<section class="card" style="margin-top:12px" aria-label="الأيام المُدخلة">
      <div class="lines l-days">
        <div class="lh"><span>اليوم</span><span class="c-r">المبيعات</span><span class="c-r">المشتريات</span><span class="c-r">المصروفات</span><span>مع الدفتر</span><span>صور الدفتر</span></div>
        ${rows}
        <div class="lf"><span class="c-d">المجموع (${daysW(ids.length)})</span><span class="c-s c-r"><span class="only-rows">المبيعات </span>${num(money(A.sales))}</span><span class="c-r only-table">${num(money(A.purch))}</span><span class="c-r only-table">${num(money(A.exp))}</span><span class="c-m only-rows">المشتريات ${num(money(A.purch))}، المصروفات ${num(money(A.exp))}</span><span class="only-table"></span><span class="only-table"></span></div>
      </div>

}

/* ================================================================== entry: one day, four steps */
function viewEntry() {
  if (!dayIds().length) return `<section class="card empty-big"><p>لا أيام بعد.</p><button type="button" class="btn-gold" data-act="newday"><i aria-hidden="true">+</i>افتح أول يوم</button></section>`;
  if (!U.day || !S.days[U.day]) U.day = lastDay();
  const day = S.days[U.day], step = STEPS.some(s => s[0] === U.step) ? U.step : 'sales';
  const view = { sales: stepSales, purch: stepPurch, exp: stepExp, check: stepCheck }[step];
  const back = U.fromSearch ? `<button type="button" class="btn-text back-s" data-act="go" data-r="search">› رجوع لنتائج البحث عن «${esc(U.q || '')}»</button>` : '';
  return back + dayHead(day) + stepNav(day, step) + view(day);
}
function dayHead(day) {
  const ids = dayIds(), i = ids.indexOf(day.id), prev = ids[i - 1], next = ids[i + 1];
  // a small pencil beside each price: a price typed wrong when the day was opened can be fixed, and the fix is logged
  const pen = f => `<button type="button" class="pen" data-act="prices" data-f="${f}" aria-label="تعديل السعر" title="تعديل السعر">${ico('edit', 14)}</button>`;
  const fact = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;
  return `<section class="dayhead" aria-label="اليوم">
    <div class="dh-date">
      <button type="button" class="arw" data-act="dayto" data-id="${prev || ''}" aria-label="اليوم السابق"${prev ? '' : ' disabled'}>›</button>
      <h1 class="kufi">${dayLong(day.id)}</h1>
      <button type="button" class="arw" data-act="dayto" data-id="${next || ''}" aria-label="اليوم التالي"${next ? '' : ' disabled'}>‹</button>
    </div>
    <dl class="dh-facts">
      ${fact('سعر البيع', (hasVal(day.sell) ? num(pr(day.sell)) : '<span class="dim">—</span>') + pen('sell'))}
      ${fact('سعر الشراء', num(pr(day.buy)) + pen('buy'))}
      ${fact('العمولة', hasVal(day.comm) ? num(money(day.comm)) : '<span class="dim">—</span>')}
    </dl>
    <div class="dh-end">${statusPill(day)}${photosBtn(day)}${commBtn(day)}</div>
  </section>`;
}
// «صور الدفتر (2)» opens or closes the photo panel; a day without photos offers to add them.
// The same button in the day header, on the dashboard and in every row of the days page; in a list it also names its day for a screen reader.
function photosBtn(day, cls = 'btn-text', named = false) {
  const n = (day.photos || []).length, label = n ? `صور الدفتر (${n})` : 'أضف صور الدفتر';
  const name = named ? ` aria-label="${label}، يوم ${DAYS_AR[dow(day.id)]} ${dnum(day.id)}/${D(day.id).getUTCMonth() + 1}"` : '';
  return n
    ? `<button type="button" class="${cls}" data-act="pvtoggle" data-id="${day.id}" aria-pressed="${!!(U.pv && U.pv.day === day.id)}"${name}>${ico('image', 15)} ${label}</button>`
    : `<button type="button" class="${cls}" data-act="photos" data-id="${day.id}"${name}>${ico('image', 15)} ${label}</button>`;
}
function stepNav(day, step) {
  const t = T(day);
  const val = { sales: num(money(t.sales)), purch: num(money(t.purch)), exp: num(money(t.exp)), check: day.status === 'ok' ? 'مطابق' : day.status === 'lerr' ? 'خطأ في جمع الدفتر' : 'لم تتم بعد' };
  return `<nav class="steps" aria-label="خطوات إدخال اليوم">${STEPS.map(([k, name], i) => {
    let sn = `<span class="sn">${i + 1}</span>`;
    if (k === 'check' && day.status === 'ok') sn = `<span class="sn ok" aria-hidden="true">${ico('check', 16)}</span>`;
    if (k === 'check' && day.status === 'lerr') sn = '<span class="sn lerr" aria-hidden="true">!</span>';
    return `<button type="button"${U.flash === k ? ' class="flash"' : ''} data-act="step" data-s="${k}"${k === step ? ' aria-current="step"' : ''}>${sn}<span class="st-t"><b>${name}</b><span>${val[k]}</span></span></button>`;
  }).join('')}</nav>`;
}
function stepHead(title, hint, acts) {
  return `<div class="step-head"><div><h2 class="kufi">${title}</h2>${hint ? `<p class="sub">${hint}</p>` : ''}</div>${acts ? `<div class="acts">${acts}</div>` : ''}</div>`;
}
// the commission button says «add» until a commission is saved for the day, then «edit»
const commLabel = d => hasVal(d.comm) ? 'تعديل العمولة' : 'أضف العمولة';
const commBtn = (d, cls = 'btn-text') => `<button type="button" class="${cls}" data-act="daydata">${ico(hasVal(d.comm) ? 'edit' : 'plus', 15)} ${commLabel(d)}</button>`;
const addBtn = (act, label) => `<button type="button" class="btn-gold" data-act="${act}"><i aria-hidden="true">+</i>${label}</button>`;
const nextBtn = (s, label) => `<div class="step-next"><button type="button" class="btn-ghost" data-act="step" data-s="${s}" data-top="1">التالي: ${label}</button></div>`;
const xNote = l => l.x ? `<span class="xr">ملغى: ${esc(l.x.r)}</span>` : '';
const rowCls = l => `ln${l.x ? ' is-x' : ''}${U.hl === l.id ? ' is-new' : ''}`;
const emptyRow = msg => `<div class="empty">${msg}</div>`;
const wCell = w => w === null ? '<span class="dim">بلا وزن</span>' : `${num(g2(w))} <span class="u">جم</span>`;

function stepSales(day) {
  const t = T(day);
  const rows = day.sales.map((l, i) => `<button type="button" class="${rowCls(l)}" data-act="line" data-sec="sales" data-id="${l.id}">

        ${rows}
        <div class="lf"><span class="c-n"></span><span class="c-p c-r">${num(money(t.sales))}</span><span class="c-w">${num(g2(t.sw))} جم</span><span class="c-d">المجموع (${linesW(t.sn)})</span><span class="c-mk c-r">${num(money(t.mk))}</span><span class="c-k"></span></div>
      </div></section>

function stepPurch(day) {

    </button>`;
  }).join('') || emptyRow('لا سطور بعد. اضغط «أضف شراءً».');
  const split = t.pj ? `<span class="u">كسر ${num(g2(t.pkw))} جم، جديد ${num(g2(t.pjw))} جم</span>` : '';

        <div class="lh"><span>#</span><span class="c-r">المبلغ</span><span>الوزن</span><span>البيان</span></div>
        ${rows}
        <div class="lf"><span class="c-n"></span><span class="c-p c-r">${num(money(t.purch))}</span><span class="c-w">${num(g2(t.pw))} جم</span><span class="c-d">المجموع (${linesW(t.pn)})${split}</span></div>
      </div></section>`
    + nextBtn('exp', 'المصروفات');
}
function stepExp(day) {
  const t = T(day);
  const rows = day.exp.map((l, i) => `<button type="button" class="${rowCls(l)}" data-act="line" data-sec="exp" data-id="${l.id}">
      <span class="c-n">${num(i + 1)}</span><span class="c-p c-r">${num(money(l.a))}</span><span class="c-d">${esc(l.d)}${xNote(l)}</span><span class="c-c"><span class="chipk">${esc(l.c)}</span></span><span class="c-e">${l.emp ? esc(l.emp) : '<span class="dim only-table">—</span>'}</span>
    </button>`).join('') || emptyRow('لا مصروفات في هذا اليوم.');
  return stepHead('المصروفات', 'لتعديل سطر، اضغط عليه.', addBtn('add-exp', 'أضف مصروفًا'))
    + `<div class="note"><span class="redmark" aria-hidden="true"></span><span>أدخل فقط المصروفات المعلَّمة بدائرة حمراء في الدفتر. ولو المصروف لموظف، اختر اسمه.</span></div>

        <div class="lf"><span class="c-n"></span><span class="c-p c-r">${num(money(t.exp))}</span><span class="c-d">المجموع (${linesW(t.en)})</span><span class="only-table"></span><span class="only-table"></span></div>
      </div></section>`

/* ================================================================== chart: one series per day, time runs right to left */
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function axisTicks(max, n = 4) { const st = niceStep(max / n), top = Math.ceil(max / st) * st, t = []; for (let v = 0; v <= top + st / 2; v += st) t.push(v); return { top, t }; }
function roundTop(x, y, w, h, r) { if (h < 0.5) return `M${x},${y}h${w}`; r = Math.min(r, w / 2, h); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
function chartBars(w, series) {
  const per = DASH.A.per, n = per.length; if (!n) return '';
  const color = C[series], label = { sales: 'المبيعات', purch: 'المشتريات', tot: 'إجمالي الأجور' }[series];
  const H = 232, pt = 26, pb = 46, ph = H - pt - pb, PR = 58, PL = 8;
  const vals = per.map(p => p[series]);
  const { top, t } = axisTicks(Math.max(1, ...vals));
  const y = v => pt + ph - v / top * ph;
  const pw = w - PL - PR, band = pw / n, cx = i => PL + pw - (i + 0.5) * band;
  const bw = Math.max(4, Math.min(24, band * 0.56)), every = Math.max(1, Math.ceil(26 / band));
  const iMax = vals.indexOf(Math.max(...vals));
  let s = '';
  for (const v of t) s += `<line class="gl" x1="${PL}" x2="${w - PR}" y1="${y(v)}" y2="${y(v)}" stroke-width="1"/><text x="${w - PR + 10}" y="${y(v) + 4}" class="ax">${int(v)}</text>`;
  per.forEach((p, i) => {
    const x = cx(i), v = vals[i];
    s += `<path d="${roundTop(x - bw / 2, y(v), bw, ph - (y(v) - pt), 4)}" style="fill:${color};stroke:${color};stroke-width:${v > 0 ? 0 : 1}"/>`;
    if (i === iMax && n > 1 && v > 0) s += `<text x="${x}" y="${y(v) - 8}" text-anchor="middle" class="lbl">${int(v)}</text>`;
    if (i % every === 0) s += `<text x="${x}" y="${H - pb + 18}" text-anchor="middle" class="ax-d">${dnum(p.id)}</text>${band >= 44 ? `<text x="${x}" y="${H - pb + 34}" text-anchor="middle" class="ax-w">${DAYS_AR[dow(p.id)]}</text>` : ''}`;
    const tipTxt = `${dayMid(p.id)}&#10;${label}: ${money(v)}${p.sell !== null && series !== 'purch' ? `&#10;سعر البيع: ${pr(p.sell)}` : ''}&#10;سعر الشراء: ${pr(p.buy)}`;
    s += `<rect class="hit" x="${x - band / 2}" y="${pt}" width="${band}" height="${ph}" data-tip="${esc(tipTxt).replace(/&amp;#10;/g, '&#10;')}" data-act="pday" data-id="${p.id}" style="cursor:pointer"/>`;
  });
  s += `<line class="bl" x1="${PL}" x2="${w - PR}" y1="${pt + ph}" y2="${pt + ph}" stroke-width="1"/>`;
  return `<svg width="${w}" height="${H}" viewBox="0 0 ${w} ${H}" role="img" aria-label="${label} لكل يوم" style="direction:ltr;display:block">${s}</svg>`;
}
function drawCharts() {
  $$('[data-chart]', screen).forEach(el => {
    const cs = getComputedStyle(el), w = Math.max(240, Math.floor(el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)));
    el.innerHTML = chartBars(w, el.dataset.series);

const waFmt = s => s.startsWith('971') && s.length === 12 ? `+971 ${s.slice(3, 5)} ${s.slice(5, 8)} ${s.slice(8)}` : `+${s}`;
function waText(day) {

}
function waDialog(id, toOwner) {

    <p class="u" style="margin:12px 0 0">الرسالة صورة لحظية: إذا عُدّل اليوم بعد الإرسال، لا تتغير الرسالة في الواتساب.</p>

function copyText(text) {
  const fallback = () => {
    try { const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); const ok = document.execCommand('copy'); t.remove(); return ok; } catch (e) { return false; }
  };
  const done = ok => toast(ok ? `${ico('check', 16)} نُسخت الرسالة. ألصقها في الواتساب.` : 'تعذّر النسخ التلقائي: حدّد نص الرسالة وانسخه.');
  try { navigator.clipboard.writeText(text).then(() => done(true), () => done(fallback())); } catch (e) { done(fallback()); }
}

/* ================================================================== ledger photos: kept with their day, shown beside the entry */
// Photos added while trying the prototype are kept in this browser only (IndexedDB); the sample pages are files.
const PHOTO_CACHE = new Map();
const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try { const r = indexedDB.open('gold-shop-photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('p'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); }
  }));
  const write = fn => open().then(db => new Promise((res, rej) => { const t = db.transaction('p', 'readwrite'); fn(t.objectStore('p')); t.oncomplete = () => res(true); t.onerror = () => rej(t.error); })).catch(() => false);
  return {
    put: (k, v) => write(s => s.put(v, k)),
    del: k => write(s => s.delete(k)),
    clear: () => write(s => s.clear()),
    all: () => open().then(db => new Promise(res => {
      const out = new Map(), rq = db.transaction('p', 'readonly').objectStore('p').openCursor();
      rq.onsuccess = () => { const c = rq.result; if (c) { out.set(c.key, c.value); c.continue(); } else res(out); };
      rq.onerror = () => res(out);
    })).catch(() => new Map()),
  };
})();
const photosOf = id => (S.days[id] && S.days[id].photos) || [];
const photoUrl = p => (p.src.startsWith('idb:') ? PHOTO_CACHE.get(p.id) || '' : p.src);
const newPid = () => `P${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
const nextLabel = list => (!list.some(p => p.label === 'sales') ? 'sales' : !list.some(p => p.label === 'cash') ? 'cash' : 'other');
// «صفحة أخرى 1»، «صفحة أخرى 2» when two photos share a label
function photoNames(list) {
  const seen = {}, total = {}, out = {};
  list.forEach(p => { total[p.label] = (total[p.label] || 0) + 1; });
  list.forEach(p => { seen[p.label] = (seen[p.label] || 0) + 1; out[p.id] = PH_LABELS[p.label] + (total[p.label] > 1 ? ` ${seen[p.label]}` : ''); });
  return out;
}
// a phone photo is made smaller before it is kept: the longest side 1600 px is plenty to read the handwriting
async function fileToJpeg(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.82);
  } finally { URL.revokeObjectURL(url); }
}
async function addFiles(files, target) {
  const list = [...(files || [])].filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic|heif)$/i.test(f.name));
  if (!list.length) { toast('اختر صورًا فقط.'); return; }
  const out = [];
  for (const file of list) { try { out.push(await fileToJpeg(file)); } catch (e) { toast(`تعذّر فتح الصورة ${esc(file.name)}. جرّب صورة بصيغة JPG.`); } }
  if (!out.length) return;
  if (target === 'newday') {
    const f = modalRoot.querySelector('form[data-form=newday]'); if (!f) return;
    f._photos = f._photos || [];
    out.forEach(data => f._photos.push({ id: newPid(), label: nextLabel(f._photos), data }));
    ndPhotosRender(f);
    return;
  }
  const d = S.days[target]; if (!d) return;
  d.photos = d.photos || [];
  const added = out.map(data => { const p = { id: newPid(), label: nextLabel(d.photos), src: '', at: Date.now(), who: ROLES[U.user].name }; p.src = `idb:${p.id}`; PHOTO_CACHE.set(p.id, data); IDB.put(p.id, data); d.photos.push(p); return p; });
  const names = photoNames(d.photos);
  logIt(d.id, 'day', 'إضافة صور الدفتر', added.map(p => names[p.id]).join('، '));
  save();
  if (modalRoot.querySelector('[data-photos]')) openModal(photosDialog(d.id));
  render();
  toast(`${ico('check', 16)} أُضيفت ${added.length === 1 ? 'صورة واحدة' : added.length === 2 ? 'صورتان' : `${num(added.length)} صور`} إلى ${esc(dayMid(d.id))}`);
}

/* The panel: on a computer it stays beside the page (the entry window moves over to make room) and shows the page
   that matches the step: the sales page for step 1, the cash page for steps 2–3, both for the comparison.
   On a phone it fills the screen. Zoom with the buttons, Ctrl + the mouse wheel, a double click or two fingers;
   drag to move. The panel is drawn once per day and page, so saving a line does not reset the zoom. */
const PV = { key: null, z: 1, drag: null, pinch: null };
function pvAuto(photos, step) {
  if (!photos.length) return null;
  if (step === 'check' && photos.length > 1) return 'all';
  const want = step === 'sales' ? 'sales' : 'cash';
  return (photos.find(p => p.label === want) || photos[0]).id;
}
function syncViewer(force) {
  if (!U.user || !U.pv) { if (pvRoot.innerHTML) pvRoot.innerHTML = ''; app.classList.remove('pv-open'); PV.key = null; return; }
  if (U.route === 'entry' && U.day && S.days[U.day]) U.pv.day = U.day;
  const id = U.pv.day, photos = photosOf(id);
  const step = U.route === 'entry' ? (STEPS.some(s => s[0] === U.step) ? U.step : 'sales') : null;
  if (step && U.pv.step !== step) { U.pv.step = step; U.pv.sel = pvAuto(photos, step); }
  if (U.pv.sel === 'all' ? photos.length < 2 : !photos.some(p => p.id === U.pv.sel)) U.pv.sel = pvAuto(photos, step || 'sales');
  app.classList.add('pv-open');
  const key = [id, U.pv.sel, photos.map(p => `${p.id}:${p.label}:${photoUrl(p) ? 1 : 0}`).join(',')].join('|');
  if (!force && key === PV.key) return;
  const same = PV.key && PV.key.split('|').slice(0, 2).join('|') === `${id}|${U.pv.sel}`;
  PV.key = key; if (!same) PV.z = 1;
  pvRoot.innerHTML = viewerHtml(id, photos, U.pv.sel);
  const st = pvRoot.querySelector('.pv-stage'); if (st) st.style.setProperty('--z', PV.z);
}
function viewerHtml(id, photos, sel) {
  const names = photoNames(photos);
  const tabs = photos.length > 1 ? `<div class="pv-tabs" role="tablist" aria-label="الصفحة">${photos.map(p => `<button type="button" role="tab" data-act="pvtab" data-v="${p.id}" aria-selected="${sel === p.id}">${names[p.id]}</button>`).join('')}<button type="button" role="tab" data-act="pvtab" data-v="all" aria-selected="${sel === 'all'}">${photos.length === 2 ? 'الصفحتان' : 'كل الصفحات'}</button></div>` : '';
  const shown = sel === 'all' ? photos : photos.filter(p => p.id === sel);
  const body = photos.length
    ? `<div class="pv-stage" tabindex="0" aria-label="صورة الدفتر. اسحبها لتحريكها.">${shown.map(p => { const u = photoUrl(p); return u ? `<img src="${esc(u)}" data-pid="${p.id}" alt="${esc(names[p.id])}" draggable="false">` : `<div class="pv-miss">${esc(names[p.id])}: الصورة غير محفوظة على هذا الجهاز.</div>`; }).join('')}</div>
      <div class="pv-tools"><button type="button" class="icon-btn" data-act="pvzoom" data-z="in" aria-label="تكبير" title="تكبير">${ico('plus', 16)}</button><button type="button" class="icon-btn" data-act="pvzoom" data-z="out" aria-label="تصغير" title="تصغير">${ico('minus', 16)}</button><button type="button" class="btn-text" data-act="pvzoom" data-z="fit">ملء العرض</button><span class="u pv-hint">اسحب الصورة لتحريكها</span><button type="button" class="btn-text" data-act="photos" data-id="${id}">إدارة الصور</button></div>`
    : `<div class="pv-empty"><p>لا توجد صور لهذا اليوم.</p><button type="button" class="btn-gold btn-sm" data-act="photos" data-id="${id}">${ico('plus', 16)} أضف صور الدفتر</button></div>`;
  return `<aside class="pviewer" aria-label="صور الدفتر">
    <div class="pv-h"><div class="pv-t"><b>صور الدفتر</b><span class="u">${S.days[id] ? dayShort(id) : ''}</span></div><button type="button" class="icon-btn" data-act="pvclose" aria-label="إغلاق الصور" title="إغلاق">${ico('x', 16)}</button></div>
    ${tabs}${body}
  </aside>`;
}
function pvZoom(z, px, py) {
  const st = pvRoot.querySelector('.pv-stage'); if (!st) return;
  z = Math.min(4, Math.max(1, z));
  const k = z / PV.z; if (Math.abs(k - 1) < 0.001) return;
  if (px === undefined) { px = st.clientWidth / 2; py = st.clientHeight / 2; }
  const sx = st.scrollLeft + px, sy = st.scrollTop + py;
  PV.z = z; st.style.setProperty('--z', z);
  st.scrollLeft = sx * k - px; st.scrollTop = sy * k - py;
}
const PTR = new Map();
pvRoot.addEventListener('wheel', e => {
  const st = e.target.closest && e.target.closest('.pv-stage'); if (!st || !(e.ctrlKey || e.metaKey)) return;
  e.preventDefault(); const r = st.getBoundingClientRect(); pvZoom(PV.z * Math.exp(-e.deltaY * 0.0025), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
pvRoot.addEventListener('dblclick', e => {
  const st = e.target.closest && e.target.closest('.pv-stage'); if (!st) return;
  const r = st.getBoundingClientRect(); pvZoom(PV.z > 1.2 ? 1 : 2.5, e.clientX - r.left, e.clientY - r.top);
});
pvRoot.addEventListener('pointerdown', e => {
  const st = e.target.closest && e.target.closest('.pv-stage'); if (!st || (e.pointerType === 'mouse' && e.button !== 0)) return;
  PTR.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { st.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  if (PTR.size === 1) { PV.drag = { id: e.pointerId, x: e.clientX, y: e.clientY, sl: st.scrollLeft, st: st.scrollTop }; st.classList.add('drag'); }
  if (PTR.size === 2) { const [a, b] = [...PTR.values()]; PV.drag = null; PV.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: PV.z }; }
});
pvRoot.addEventListener('pointermove', e => {
  if (!PTR.has(e.pointerId)) return;
  const st = pvRoot.querySelector('.pv-stage'); if (!st) return;
  PTR.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (PV.pinch && PTR.size === 2) {
    const [a, b] = [...PTR.values()], r = st.getBoundingClientRect();
    pvZoom(PV.pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / PV.pinch.d, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
  } else if (PV.drag && PV.drag.id === e.pointerId) {
    st.scrollLeft = PV.drag.sl - (e.clientX - PV.drag.x); st.scrollTop = PV.drag.st - (e.clientY - PV.drag.y);
  }
});
const pvEnd = e => {
  PTR.delete(e.pointerId);
  const st = pvRoot.querySelector('.pv-stage');
  if (PTR.size < 2) PV.pinch = null;
  if (PTR.size === 1 && st) { const [[pid, q]] = [...PTR.entries()]; PV.drag = { id: pid, x: q.x, y: q.y, sl: st.scrollLeft, st: st.scrollTop }; } else if (!PTR.size) { PV.drag = null; if (st) st.classList.remove('drag'); }
};
pvRoot.addEventListener('pointerup', pvEnd);
pvRoot.addEventListener('pointercancel', pvEnd);

function sugIndex(sec) {

    if (l.x) continue;
    const d = String(l.d || '').trim(); if (!d || /\.\.\.|…|^\(/.test(d)) continue;
    const k = normS(d), r = m.get(k) || { d, k, n: 0 };

    .sort((a, b) => (a.i === 0 ? 0 : 1) - (b.i === 0 ? 0 : 1) || b.r.n - a.r.n || a.r.d.localeCompare(b.r.d, 'ar'))

  if (sec === 'exp') return sameNum(a.a, b.a) && (a.c || '') === (b.c || '') && (a.emp || '') === (b.emp || '');
  if (W(a.g, a.m) !== W(b.g, b.m)) return false;
  if (sec === 'purch') return sameNum(a.a, b.a) && (a.t || 'كسر') === (b.t || 'كسر');
  return sameNum(a.p, b.p) && sameNum(a.mk, b.mk) && (a.k || '') === (b.k || '');
}

/* ================================================================== live updates while typing */
function liveUpdate(f) {
  if (!f) return;
  const kind = f.dataset.form;
  if (kind === 'line') {
    const w = f.g ? W(latin(f.g.value).trim(), latin(f.m.value).trim()) : null;
    const wo = f.querySelector('[data-out="w"]'); if (wo) wo.innerHTML = `= ${num(g2(w || 0))} جم`;
    const po = f.querySelector('[data-out="ppg"]');
    if (po) {
      const a = parseNum(f.a.value), d = S.days[U.day];
      const ref = `سعر الشراء اليوم ${num(pr(d.buy))}${hasVal(d.sell) ? `، وسعر البيع ${num(pr(d.sell))}` : ''}.`;
      po.innerHTML = w && a > 0 ? `سعر الجرام ${num(money(a / w))}. ${ref}` : ref;
    }
  } else if (kind === 'daydata') {
    const o = f.querySelector('[data-out="tot"]'), mk = Number(o.dataset.mk), cm = parseNum(f.comm.value) || 0, x = parseNum(f.x.value) || 0;
    o.innerHTML = `إجمالي الأجور = الأجور ${num(money(mk))} + العمولة ${num(money(cm))}${x ? ` + ${esc(f.xl.value.trim() || 'بند إضافي')} ${num(money(x))}` : ''} = <b class="num">${money(mk + cm + x)}</b>`;
  } else if (kind === 'newday') {
    const o = f.querySelector('[data-out="dlabel"]'); if (o && /^\d{4}-\d{2}-\d{2}$/.test(f.date.value)) o.textContent = dayLong(f.date.value);
  } else if (kind === 'compare') {
    const day = S.days[U.day], t = T(day); let filled = 0; const bad = [];
    for (const [k, label] of CMP_ROWS) {
      const tr = f.querySelector(`tr[data-row="${k}"]`), v = parseNum(f[k].value), res = tr.querySelector('[data-res]');
      if (isNaN(v)) { res.innerHTML = '<span class="dim">—</span>'; tr.classList.remove('bad'); f[k].removeAttribute('aria-invalid'); continue; }
      filled++;
      const diff = r2(t[k] - v);
      if (Math.abs(diff) < 0.005) { res.innerHTML = `<span class="pill ok">${ico('check', 13)} مطابق</span>`; tr.classList.remove('bad'); f[k].removeAttribute('aria-invalid'); }
      else {
        res.innerHTML = `<span class="pill warn">${diff > 0 ? 'النظام أكثر بـ' : 'النظام أقل بـ'} ${isW(k) ? `${num(g2(Math.abs(diff)))} جم` : num(money(Math.abs(diff)))}</span>`;
        tr.classList.add('bad'); f[k].setAttribute('aria-invalid', 'true'); bad.push([k, label, v, t[k]]);
      }
    }
    f._bad = bad; f._filled = filled;
    const vo = f.querySelector('[data-out="verdict"]'), ao = f.querySelector('[data-out="acts"]');
    if (!filled || (!bad.length && day.status === 'ok')) { vo.innerHTML = ''; ao.innerHTML = ''; return; }
    if (!bad.length) {
      vo.innerHTML = `<div class="verdict">كل ما كتبته مطابق للدفتر (${num(filled)} من ${num(CMP_ROWS.length)}).</div>`;
      ao.innerHTML = `<button type="button" class="btn-gold" data-act="cmpok">${ico('check', 18)} احفظ: مطابق للدفتر</button>`;
      return;
    }
    const purchOnly = bad.every(b => b[0] === 'purch' || b[0] === 'pw');
    const commHint = !hasVal(day.comm) && bad.some(b => b[0] === 'tot') ? ' والعمولة لم تُكتب لهذا اليوم، وقد تكون هي سبب الفرق في إجمالي الأجور.' : '';
    vo.innerHTML = `<p class="err" style="margin-top:12px">فيه فرق في ${bad.length === 1 ? 'بند واحد' : bad.length === 2 ? 'بندين' : `${num(bad.length)} بنود`}. راجع السطور: غالبًا سطر لم يُدخل أو رقم كُتب خطأ. إذا كانت السطور صحيحة، فالخطأ في جمع الدفتر نفسه.${commHint}</p>`;
    ao.innerHTML = `<button type="button" class="btn-gold" data-act="step" data-s="${purchOnly ? 'purch' : 'sales'}" data-top="1">راجع ${purchOnly ? 'المشتريات' : 'المبيعات'}</button>${day.status === 'lerr' ? '' : '<button type="button" class="btn-ghost" data-act="cmplerr">السطور صحيحة: احفظ مع ملاحظة «خطأ في جمع الدفتر»</button>'}`;
  }
}

/* ================================================================== saving */
function showErr(f, msg, field) {

function readLine(f, sec) {

    const d = (f.d.value || '').trim();
    let g = v('g'), m = v('m');
    const gm = g.match(/^(\d*)[.٫](\d{1,2})$/); if (gm && !m) { g = gm[1]; m = gm[2]; }
    if (!d) return [null, 'اكتب البيان كما في الدفتر.', 'd'];
    if (g && !/^\d+$/.test(g)) return [null, 'الجرام رقم صحيح بلا فواصل، مثل 7.', 'g'];
    if (m && !/^\d{1,2}$/.test(m)) return [null, 'الملي رقم أو رقمان كما في الدفتر: 3 تعني 0.30، و03 تعني 0.03.', 'm'];
    if (sec === 'purch' && !g && !m) return [null, 'اكتب الوزن: كل شراء له وزن في الدفتر.', 'g'];
    if (sec === 'sales') {
      const p = parseNum(f.p.value), mk = v('mk') === '' ? null : parseNum(f.mk.value);
      if (!(p > 0)) return [null, 'اكتب السعر.', 'p'];
      if (mk !== null && !(mk >= 0)) return [null, 'الأجور رقم، أو اتركها فارغة.', 'mk'];
      return [{ d, g: g === '' ? null : Number(g), m, k: f.k.value, mk, p }];
    }
    const a = parseNum(f.a.value); if (!(a > 0)) return [null, 'اكتب المبلغ.', 'a'];
    return [{ d, g: g === '' ? null : Number(g), m, a, t: f.t.value || 'كسر' }];
  }
  const d = (f.d.value || '').trim(), a = parseNum(f.a.value), nn = (f.nn.value || '').trim();
  if (!d) return [null, 'اكتب البيان.', 'd'];
  if (!(a > 0)) return [null, 'اكتب المبلغ.', 'a'];
  const emp = nn || (f.emp.value === NO_EMP ? '' : f.emp.value);
  return [{ d, c: f.c.value || 'أخرى', emp, a }];
}
function describe(sec, l) {
  if (sec === 'sales') { const w = W(l.g, l.m); return `${l.d}${w !== null ? `، ${g2(w)} جم` : ''}${l.k ? `، عيار ${l.k}` : ''}، ${money(l.p)}`; }
  if (sec === 'purch') return `${l.t === 'جديد' ? 'جديد: ' : ''}${l.d}، ${g2(W(l.g, l.m) || 0)} جم، ${money(l.a)}`;
  return `${l.d}، ${l.c}${l.emp ? `، ${l.emp}` : ''}، ${money(l.a)}`;
}
function diffText(sec, a, b) {
  const out = [];
  const fld = (label, x, y, fmt = s => s) => { if (String(x ?? '') !== String(y ?? '')) out.push(`${label}: ${hasVal(x) ? fmt(x) : '—'} ← ${hasVal(y) ? fmt(y) : '—'}`); };
  fld('البيان', a.d, b.d);
  if (sec === 'sales' || sec === 'purch') { const wa = W(a.g, a.m), wb = W(b.g, b.m); if (wa !== wb) out.push(`الوزن: ${wa === null ? '—' : g2(wa)} ← ${wb === null ? '—' : g2(wb)} جم`); }
  if (sec === 'sales') { fld('العيار', a.k, b.k); fld('الأجور', a.mk, b.mk); fld('السعر', a.p, b.p, money); }
  if (sec === 'purch') fld('النوع', a.t, b.t);
  if (sec === 'exp') { fld('النوع', a.c, b.c); fld('الموظف', a.emp, b.emp); }
  if (sec !== 'sales') fld('المبلغ', a.a, b.a, money);

}
function reopen(day) { if (day.status === 'ok' || day.status === 'lerr') { day.status = 'open'; day.note = ''; } }
function saveLine(f) {
  const sec = f.dataset.sec, day = S.days[U.day], arr = day[sec];
  const [data, err, field] = readLine(f, sec);
  if (!data) return showErr(f, err, field);
  if (sec === 'exp' && data.emp && !S.settings.names.includes(data.emp)) S.settings.names.push(data.emp);
  if (f.dataset.id) {
    const l = arr.find(x => x.id === f.dataset.id), before = { ...l };
    Object.assign(l, data);
    const dt = diffText(sec, before, l);
    if (dt) { if (sec !== 'exp') reopen(day); logIt(day.id, 'edit', `تعديل سطر ${SEC_ONE[sec]} ${arr.indexOf(l) + 1}، ${l.d}`, dt); }
    save(); closeModal(); U.hl = l.id; U.flash = sec; render();
    toast(`${ico('check', 16)} ${dt ? `حُفظ التعديل: ${esc(dt)}` : 'لم يتغير شيء'}`);
    return;
  }
  const prev = arr[arr.length - 1];
  if (!f._dupOK && prev && !prev.x && sameLine(sec, prev, data)) return showDup(f, sec, prev, arr.length);
  const l = { id: nid(), ...data }; arr.push(l);
  if (sec !== 'exp') reopen(day);
  logIt(day.id, 'add', `إضافة سطر ${SEC_ONE[sec]} ${arr.length}`, describe(sec, l));
  save(); U.hl = l.id; U.flash = sec; render();
  toast(`${ico('check', 16)} أُضيف سطر ${SEC_ONE[sec]} ${num(arr.length)}: ${num(money(sec === 'sales' ? l.p : l.a))}`);
  // the window stays open for the next line
  const last = f.querySelector('[data-out="last"]'), note = lastLineNote(day, sec);
  if (last) last.innerHTML = note; else f.querySelector('.dlg-h').insertAdjacentHTML('afterend', `<div class="dlg-note" data-out="last">${note}</div>`);
  const tag = f.querySelector('.dlg-h .pill'); if (tag) tag.innerHTML = `${dayShort(day.id)}، السطر ${num(arr.length + 1)}`;
  if (sec === 'exp' && data.emp) {
    // keep the employee choices current after a new name
    const box = f.querySelector('[data-chips="emp"]'), hid = box.nextElementSibling;
    box.innerHTML = [NO_EMP, ...S.settings.names].map(o => `<button type="button" class="chip" data-act="chip" data-v="${esc(o)}" aria-pressed="${o === NO_EMP}">${esc(o)}</button>`).join('');

}
function savePrices(f) {
  const d = S.days[U.day], buy = parseNum(f.buy.value), sell = f.sell.value.trim() === '' ? null : parseNum(f.sell.value);
  if (!(buy > 0)) return showErr(f, 'اكتب سعر الشراء من عمود «سعر الذهب» في صفحة المبيعات.', 'buy');
  if (sell !== null && !(sell > 0)) return showErr(f, 'سعر البيع رقم، أو اتركه فارغًا.', 'sell');
  const ch = [];
  if (!sameNum(d.buy, buy)) ch.push(`سعر الشراء: ${pr(d.buy)} ← ${pr(buy)}`);
  if (!sameNum(d.sell, sell)) ch.push(`سعر البيع: ${pr(d.sell)} ← ${pr(sell)}`);
  closeModal();
  if (!ch.length) { toast('لم يتغير شيء'); return; }
  d.buy = buy; d.sell = sell;
  logIt(d.id, 'day', 'تعديل السعر', ch.join('؛ '));
  save(); render();
  toast(`${ico('check', 16)} حُفظ التعديل: ${esc(ch.join('، '))}`);
}
function saveDayData(f) {
  const d = S.days[U.day];
  const comm = f.comm.value.trim() === '' ? null : parseNum(f.comm.value), x = f.x.value.trim() === '' ? null : parseNum(f.x.value);
  if (comm !== null && !(comm >= 0)) return showErr(f, 'العمولة رقم، أو اتركها فارغة.', 'comm');
  if (x !== null && !(x >= 0)) return showErr(f, 'مبلغ البند الإضافي رقم، أو اتركه فارغًا.', 'x');
  const before = { comm: d.comm, xl: d.xl, x: d.x };
  Object.assign(d, { comm, xl: (f.xl.value || '').trim(), x });
  const ch = [];
  const cmp = (label, a, b) => { if (String(a ?? '') !== String(b ?? '')) ch.push(`${label}: ${hasVal(a) ? a : '—'} ← ${hasVal(b) ? b : '—'}`); };
  cmp('العمولة', before.comm, d.comm);
  if (String(before.x ?? '') !== String(d.x ?? '') || before.xl !== d.xl) ch.push(`البند الإضافي: ${before.xl || ''} ${before.x ?? '—'} ← ${d.xl || ''} ${d.x ?? '—'}`);

}
function saveCompare(f, lerr) {

function newDay(f) {

  if (sell !== null && !(sell > 0)) return showErr(f, 'سعر البيع رقم، أو اتركه فارغًا.', 'sell');

  logIt(id, 'day', 'فتح اليوم', `سعر الشراء ${buy}${sell !== null ? `، سعر البيع ${sell}` : ''}`);

  if (top + r.height > window.innerHeight - 8) top = y - r.height - 14;

}
