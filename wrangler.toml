name = "gold-system"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "gold-db"
database_id = "e02c7a78-7655-4592-a878-eb665ee4694d"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "gold-photos"

[triggers]
crons = ["0 23 * * *"]

[vars]
RP_NAME = "نظام الذهب"
# ORIGIN و RP_ID اختيارية: إذا فارغة تُؤخذ من عنوان الموقع نفسه.
